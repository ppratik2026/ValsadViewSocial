name: Scheduler (every 2 hours)

# Posts a reel every 2 hours (config.yaml -> schedule.every_hours) from 10:00 to midnight IST. GitHub's own schedule drops runs when it is busy,
# so this job stays up and posts on time itself; after ~5.5 hours (jobs stop at 6) it starts the next
# scheduler run, so the chain never ends. The cron below only restarts the chain if it ever stops.
# Free for public repositories. To pause posting: Actions -> Scheduler (every 2 hours) -> "..." -> Disable workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "13 */4 * * *"

permissions:
  contents: write
  actions: write      # to start the next scheduler run
  models: read

concurrency:
  group: scheduler    # one scheduler at a time; a second one waits for the first to finish
  cancel-in-progress: false

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Which flow
        id: flow
        # flow "gemini_app" posts from GitHub issues (prepare-post.yml), so this scheduler has nothing to do and
        # must not start the next run either (that would chain empty runs forever)
        run: echo "flow=$(python3 -c "import yaml; print(yaml.safe_load(open('config.yaml')).get('flow', 'auto'))")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.flow.outputs.flow != 'gemini_app'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        if: steps.flow.outputs.flow != 'gemini_app'
        # a stuck Ubuntu mirror once hung this step for over half an hour: each try is time-limited
        timeout-minutes: 12
        run: |
          for try in 1 2 3; do
            sudo timeout 150 apt-get update -o Acquire::Retries=3 &&
              sudo timeout 300 apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg fonts-noto-core fonts-noto-color-emoji && break
            echo "apt try $try failed, retrying"; sleep 15
          done
          command -v ffmpeg >/dev/null   # the reel cannot be made without it

      - name: Install Python packages
        if: steps.flow.outputs.flow != 'gemini_app'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Post every 2 hours
        if: steps.flow.outputs.flow != 'gemini_app'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python -u main.py scheduler --hours 5.5

      - name: Start the next scheduler run
        if: always() && !cancelled() && steps.flow.outputs.flow != 'gemini_app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scheduler.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
